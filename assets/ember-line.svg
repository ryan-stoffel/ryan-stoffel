<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b949e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .ember { animation: travel 9s cubic-bezier(.45,.05,.55,.95) infinite; }
    .core  { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes travel {
      0%   { transform: translateX(120px); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(680px); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ember { animation: none; transform: translateX(400px); }
      .core  { animation: none; }
    }
  </style>
  <rect x="0" y="19.5" width="800" height="1" fill="url(#line)"/>
  <g class="ember">
    <rect x="-90" y="19.25" width="90" height="1.5" fill="url(#trail)"/>
    <circle cx="0" cy="20" r="11" fill="url(#glow)"/>
    <circle class="core" cx="0" cy="20" r="2.4" fill="#fbbf24"/>
  </g>
</svg>
