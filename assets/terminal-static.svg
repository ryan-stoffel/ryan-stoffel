<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" fill="none" role="img" aria-labelledby="terminal-title terminal-description">
  <title id="terminal-title">Ryan Stoffel — software, systems, and applied AI</title>
  <desc id="terminal-description">A terminal displays Ryan's profile and projects: ember, Formula Fly, Photon, and Tidy. This version contains no animation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="880" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#111c22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <clipPath id="window"><rect x=".5" y=".5" width="879" height="389" rx="12"/></clipPath>
    <clipPath id="command-clip"><rect class="type-window" x="60" y="72" width="156" height="27"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
    .ink { fill: #e4edf2; }
    .muted { fill: #9caebc; }
    .green { fill: #a6d9b1; }
    .typing-cursor { opacity: 0; }
    </style>
  <g clip-path="url(#window)">
    <rect width="880" height="390" fill="url(#surface)"/>
    <rect width="880" height="50" fill="#182129"/>
    <path d="M0 50H880" stroke="#2a3741"/>
    <circle cx="27" cy="25" r="4" fill="#c77676"/>
    <circle cx="43" cy="25" r="4" fill="#c8ad78"/>
    <circle cx="59" cy="25" r="4" fill="#85b991"/>
    <text x="88" y="30" class="muted" font-size="12">~/ryan-stoffel</text>
    <text x="852" y="30" text-anchor="end" class="muted" font-size="12">zsh</text>
    <text x="32" y="92" class="green" font-size="20">❯</text>
    <text x="60" y="92" class="ink" font-size="20" textLength="156" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-clip)">cat README.md</text>
    <rect class="typing-cursor" x="60" y="76" width="10" height="21" rx="1" fill="#a6d9b1"/>
    <text x="32" y="140" class="ink reveal identity" font-size="32" font-weight="600" letter-spacing="-.8">Ryan Stoffel</text>
    <text x="32" y="170" class="muted reveal focus" font-size="18">Software · Systems · Applied AI</text>
    <text x="32" y="217" class="muted reveal directory" font-size="14">~/projects</text>
    <g class="reveal project-one">
      <text x="32" y="250" class="green" font-size="19">ember</text>
      <text x="223" y="250" class="muted" font-size="18">context for coding agents</text>
    </g>
    <g class="reveal project-two">
      <text x="32" y="279" class="green" font-size="19">formula-fly</text>
      <text x="223" y="279" class="muted" font-size="18">neural wiring + reinforcement learning</text>
    </g>
    <g class="reveal project-three">
      <text x="32" y="308" class="green" font-size="19">photon · tidy</text>
      <text x="223" y="308" class="muted" font-size="18">native macOS tools</text>
    </g>
    <g class="reveal ready">
      <text x="32" y="354" class="green" font-size="20">❯</text>
      <rect class="resting-cursor" x="60" y="338" width="10" height="21" rx="1" fill="#a6d9b1"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="879" height="389" rx="12" stroke="#31404b"/>
</svg>
